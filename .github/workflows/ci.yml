name: CI / Automated Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smart-contract-tests:
    name: Soroban Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Soroban Contract Tests
        run: |
          cd contracts/challenge-contract
          cargo test --verbose

  backend-verification:
    name: Fastify Backend Tests & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: stellarcampus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Prisma Client Generation & Schema Push
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/stellarcampus_test?schema=public
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run Backend Vitest Suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/stellarcampus_test?schema=public
          JWT_SECRET: test-ci-secret-key-12345
        run: npm test

      - name: Verify TypeScript Compilation
        working-directory: backend
        run: npm run build
